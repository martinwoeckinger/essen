<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------- Icon (Google Material Symbols) ---------- */
const Icon = ({name,className,style}) => (
  <span className={'msym'+(className?' '+className:'')} style={style} aria-hidden="true">{name}</span>
);

/* ---------- Mahlzeiten ---------- */
const MEALS={
  breakfast:{label:'Frühstück',icon:'bakery_dining',hour:8,order:0},
  lunch:{label:'Mittagessen',icon:'lunch_dining',hour:12,order:1},
  dinner:{label:'Abendessen',icon:'dinner_dining',hour:19,order:2},
  snack:{label:'Snack',icon:'cookie',hour:16,order:3},
};
const MEAL_ORDER=Object.keys(MEALS).sort((a,b)=>MEALS[a].order-MEALS[b].order);
/* ---------- Training ---------- */
const EX_TYPES={strength:{label:'Kraft',icon:'fitness_center'},cardio:{label:'Ausdauer',icon:'directions_run'},mobility:{label:'Mobility',icon:'self_improvement'},other:{label:'Sonstiges',icon:'sports'}};
const EX_INT={low:'leicht',mid:'mittel',high:'hart'};
const exType = e => EX_TYPES[e&&e.type]?e.type:'other';
const countsAsTraining = e => exType(e)!=='mobility';
/* Grobe kcal-Schätzung über MET × kg × Stunden. Kraft 3,5 (nach gemessenen Werten des Nutzers: ca. 200–300 kcal pro Einheit), Ausdauer 8, Mobility 2,5. */
const estimateKcal=(type,durationMin,weight)=>{const met={strength:3.5,cardio:8,mobility:2.5,other:4}[type]||4;return Math.round(met*(+weight||75)*((+durationMin||0)/60));};
/* Hevy-Krafttraining: Schätzung zusätzlich bei 300 kcal gedeckelt (Erfahrungswert aus Pulsmessungen). */
const HEVY_KCAL_CAP=300;
const hevyKcal=(durationMin,weight)=>Math.min(HEVY_KCAL_CAP,estimateKcal('strength',durationMin,weight));
const defaultMeal=()=>{const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h<18?'snack':'dinner';};

/* ---------- Berechnung ---------- */
/* Tagesbudget: fester, manuell eingetragener Wert – je nachdem, ob der Tag als Trainingstag markiert ist. */
const isTrainingDay = day => !!(day&&day.training);
const dailyBudget = (g,day) => Math.round(+(isTrainingDay(day)?g.kcalTraining:g.kcalRest)||0);
const dayTypeLabel = day => isTrainingDay(day)?'Trainingstag':'Kein Trainingstag';
/* Makro-Ziele: feste, manuell eingetragene Gramm-Werte je Tagestyp. */
const macrosFor = (g,training) => training
  ? {protein:Math.round(+g.proteinTraining||0),carbs:Math.round(+g.carbsTraining||0),fat:Math.round(+g.fatTraining||0)}
  : {protein:Math.round(+g.proteinRest||0),carbs:Math.round(+g.carbsRest||0),fat:Math.round(+g.fatRest||0)};
const targetMacros = (g,day) => macrosFor(g,isTrainingDay(day));
const sumCal = fs => Math.round(fs.reduce((a,f)=>a+(+f.calories||0),0));
function sumNut(fs){
  const t={calories:0,protein:0,carbs:0,sugar:0,fat:0,saturatedFat:0,fiber:0,salt:0};
  fs.forEach(f=>{t.calories+=+f.calories||0;t.protein+=+f.protein||0;t.carbs+=+f.carbs||0;t.sugar+=+f.sugar||0;t.fat+=+f.fat||0;t.saturatedFat+=+f.saturatedFat||0;t.fiber+=+f.fiber||0;t.salt+=+f.salt||0;});
  return {calories:Math.round(t.calories),protein:Math.round(t.protein),carbs:Math.round(t.carbs),sugar:Math.round(t.sugar),fat:Math.round(t.fat),saturatedFat:Math.round(t.saturatedFat),fiber:Math.round(t.fiber),salt:Math.round(t.salt*10)/10};
}
const mealTotals = fs => { const o={}; MEAL_ORDER.forEach(m=>o[m]=sumNut(fs.filter(f=>f.meal===m))); return o; };
const KCAL_PER_KG=7700;

/* ---------- Datum ---------- */
const pad2 = s => String(s).padStart(2,'0');
const todayKey = (d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays = (k,n)=>{const[y,m,d]=k.split('-').map(Number);return todayKey(new Date(y,m-1,d+n));};
const dateLabel = k=>{const t=todayKey();if(k===t)return'Heute';if(k===addDays(t,-1))return'Gestern';const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});};
const weekdayShort = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'short'});};
const monthLabel = k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});};
const fullDate = k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const isoAt = (k,h,min=0)=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,h,min).toISOString();};
const timeLabel = iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d.getTime()))return'';try{return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
const getMonday = k=>{const[y,m,d]=k.split('-').map(Number);const dow=(new Date(y,m-1,d).getDay()+6)%7;return addDays(k,-dow);};
const uid = ()=> (crypto?.randomUUID?.() || Math.random().toString(36).slice(2));

/* ---------- Uhrzeiten ---------- */
/* Echte Essenszeit: explizit gesetzt (timeSet) oder von Hand erfasst; Import-Einträge ohne Uhrzeit haben nur eine Kunstzeit. */
const hasRealTime = f => !!(f&&f.time&&(f.timeSet||(f.source&&f.source!=='import')));
const hourOf = iso=>{const d=new Date(iso);return d.getHours()+d.getMinutes()/60;};
const parseHM = s=>{const m=String(s||'').trim().match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];return (h<24&&mi<60)?{h,m:mi}:null;};
const hmStr = (h,m)=>pad2(h)+':'+pad2(m);
const nowHM = ()=>{const d=new Date();return hmStr(d.getHours(),d.getMinutes());};
const defaultHM = (date,meal)=> date===todayKey()?nowHM():hmStr((MEALS[meal]||MEALS.snack).hour,0);
const isoFromHM = (date,hm)=>{const t=parseHM(hm);return t?isoAt(date,t.h,t.m):null;};
const fmtDur = h=>{const t=Math.max(0,Math.round(h*60));return Math.floor(t/60)+' h '+pad2(t%60);};
const fmtClock = h=>{const t=Math.round(h*60);return pad2(Math.floor(t/60)%24)+':'+pad2(t%60);};
function dayTimes(day){return ((day&&day.foods)||[]).filter(hasRealTime).map(f=>({h:hourOf(f.time),kcal:+f.calories||0,name:f.name,meal:f.meal})).sort((a,b)=>a.h-b.h);}
function eatingStats(day){
  const ts=dayTimes(day); if(!ts.length)return null;
  const first=ts[0].h,last=ts[ts.length-1].h; const total=ts.reduce((a,t)=>a+t.kcal,0)||1;
  const late=ts.filter(t=>t.h>=20).reduce((a,t)=>a+t.kcal,0);
  const gaps=[]; for(let i=1;i<ts.length;i++){const g=ts[i].h-ts[i-1].h;if(g>=0.5)gaps.push(g);}
  return {first,last,window:last-first,count:ts.length,lateShare:late/total,gaps,ts,total};
}

}

function Donut({segments,size=116,stroke=16,center}){

function niceMax(v){ if(v<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=1.2?1.2:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=3.5?3.5:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10; return s*p; }

/* Weiches Flächendiagramm mit Hover-Werten (Zeitverlauf). Lücken = nicht erfasste Tage. */
function smoothPath(seg,yMin,yMax){
  if(seg.length===1)return `M${seg[0].x},${seg[0].y}`;
  const cl=v=>Math.max(yMin,Math.min(yMax,v)); let d=`M${seg[0].x},${seg[0].y}`;
  for(let i=0;i<seg.length-1;i++){const p0=seg[i-1]||seg[i],p1=seg[i],p2=seg[i+1],p3=seg[i+2]||p2;
    d+=` C${p1.x+(p2.x-p0.x)/6},${cl(p1.y+(p2.y-p0.y)/6)} ${p2.x-(p3.x-p1.x)/6},${cl(p2.y-(p3.y-p1.y)/6)} ${p2.x},${p2.y}`;}
  return d;
}

      {segs.map((sg,k)=>(<g key={k}><path d={smoothPath(sg,padT,padT+ih)+` L${sg[sg.length-1].x},${Y(0)} L${sg[0].x},${Y(0)} Z`} fill={`url(#${gid})`}/><path d={smoothPath(sg,padT,padT+ih)} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" className="achart-line"/></g>))}

/* ---------- Tages-Übersicht für Claude ---------- */
function buildDaySummary(state,date){
  const {profile,goal}=state;
  const day=state.days[date]||{date,foods:[],exercises:[]};
  const t=sumNut(day.foods);
  const burned=Math.round(day.exercises.reduce((a,e)=>a+(+e.calories||0),0));
  const budget=dailyBudget(goal,day);
  const tgt=targetMacros(goal,day);
  const rest=budget-t.calories;
  const L=[];
  L.push('Ernährungs-Tagesübersicht – '+fullDate(date));
  L.push('');
  L.push('Ziel: Tagesbudget '+budget+' kcal ('+dayTypeLabel(day)+')');
  L.push('Profil: '+(profile.sex==='male'?'m':'w')+', '+profile.age+' J, '+profile.height+' cm, '+profile.weight+' kg'+(profile.targetWeight?' (Ziel '+profile.targetWeight+' kg)':''));
  if((goal.preferences||'').trim()) L.push('Vorlieben/Hinweise: '+goal.preferences.trim());
  L.push('');
  L.push('Gegessen: '+t.calories+' / '+budget+' kcal (Rest '+rest+')'+(burned?' · Sport +'+burned+' kcal':''));
  L.push('Makros: Eiweiß '+t.protein+'/'+tgt.protein+' g · KH '+t.carbs+'/'+tgt.carbs+' g · Fett '+t.fat+'/'+tgt.fat+' g');
  L.push('Weiteres: Ballaststoffe '+t.fiber+'/'+goal.fiberGoal+' g · Zucker '+t.sugar+' (max '+goal.sugarLimit+') · ges. FS '+t.saturatedFat+' (max '+goal.satFatLimit+') · Salz '+t.salt+' (max '+goal.saltLimit+') g');
  MEAL_ORDER.forEach(m=>{
    const items=day.foods.filter(f=>f.meal===m); if(!items.length)return;
    L.push('');
    L.push(MEALS[m].icon+' '+MEALS[m].label+' ('+sumCal(items)+' kcal)');
    items.forEach(f=>L.push('- '+(hasRealTime(f)?timeLabel(f.time)+' ':'')+f.name+(f.quantity?', '+f.quantity:'')+' — '+Math.round(f.calories)+' kcal (E'+f.protein+'/KH'+f.carbs+'/F'+f.fat+')'+(f.note?' · '+f.note:'')));
  });
  if(day.exercises.length){
    L.push('');
    L.push('Training: '+day.exercises.map(e=>e.name+' ('+EX_TYPES[exType(e)].label+(e.durationMin?', '+e.durationMin+' min':'')+(e.intensity?', '+EX_INT[e.intensity]:'')+', −'+Math.round(e.calories)+' kcal)').join(', '));
  }
  if(!day.foods.length) L.push('\n(An diesem Tag wurde noch nichts erfasst.)');
  L.push('');
  L.push('---');
  L.push('Das ist meine Ernährung an diesem Tag. Bitte gib mir kurzes, konkretes Feedback (Makro-Balance, Kalorienziel, was ich verbessern könnte).');
  return L.join('\n');
}

function shrinkImage(file,max=1280){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      try{
        const sc=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=c.toDataURL('image/jpeg',0.85); URL.revokeObjectURL(url);
        resolve({media_type:'image/jpeg',data:dataUrl.split(',')[1],preview:dataUrl});
      }catch(e){reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht geladen werden'));};
    img.src=url;
  });
}

function HevyOverlay({state,setState,onClose,notify}){

      firstMeal:st?fmtClock(st.first):null,lastMeal:st?fmtClock(st.last):null,eatingWindowH:st?Math.round(st.window*10)/10:null,fastingH:fast!=null?Math.round(fast*10)/10:null,lateShare:st?Math.round(st.lateShare*100):null,

function Stats({state,setState,setDate,goToToday,cloud,notify,garmin}){
  const {profile,goal,days}=state;
  const [range,setRange]=useState(7);
  const [metric,setMetric]=useState('calories');
  const today=todayKey();
  const rows=useMemo(()=>{
    const keys=[]; for(let i=range-1;i>=0;i--)keys.push(addDays(today,-i));
    return keys.map(k=>{const d=days[k]||{foods:[],exercises:[]};const budget=dailyBudget(goal,d);
      return {key:k,budget,totals:sumNut(d.foods),target:targetMacros(goal,d),meals:mealTotals(d.foods),has:d.foods.length>0};});
  },[days,goal,range,today]);
  const tracked=rows.filter(r=>r.has);

  const chartData=rows.map(r=>{
    let value=0,ref=undefined,over=false;
    if(metric==='calories'){value=r.totals.calories;ref=r.budget;over=value>r.budget;}
    else if(metric==='protein'){value=r.totals.protein;ref=r.target.protein;}
    else if(metric==='carbs'){value=r.totals.carbs;ref=r.target.carbs;}
    else if(metric==='fat'){value=r.totals.fat;ref=r.target.fat;}
    else if(metric==='fiber'){value=r.totals.fiber;ref=goal.fiberGoal;}
    else if(metric==='sugar'){value=r.totals.sugar;ref=goal.sugarLimit;over=value>goal.sugarLimit;}
    else if(metric==='salt'){value=r.totals.salt;ref=goal.saltLimit;over=value>goal.saltLimit;}
    return {key:r.key,value,ref,over};
  });
  const mInfo=METRICS.find(m=>m.id===metric);
  const tVals=chartData.map((d,i)=>rows[i].has?d.value:null);
  const present=tVals.filter(v=>v!=null);
  const mAvg=avgArr(present);
  const half=Math.floor(present.length/2);
  const trend=present.length>=4?avgArr(present.slice(half))-avgArr(present.slice(0,half)):0;

  const avgTotals={calories:avgArr(tracked.map(r=>r.totals.calories)),protein:avgArr(tracked.map(r=>r.totals.protein)),carbs:avgArr(tracked.map(r=>r.totals.carbs)),sugar:avgArr(tracked.map(r=>r.totals.sugar)),fat:avgArr(tracked.map(r=>r.totals.fat)),saturatedFat:avgArr(tracked.map(r=>r.totals.saturatedFat)),fiber:avgArr(tracked.map(r=>r.totals.fiber)),salt:avgArr(tracked.map(r=>r.totals.salt))};
  const avgTarget={protein:Math.round(avgArr(rows.map(r=>r.target.protein))),carbs:Math.round(avgArr(rows.map(r=>r.target.carbs))),fat:Math.round(avgArr(rows.map(r=>r.target.fat)))};
  const mealAvg=MEAL_ORDER.map(meal=>({meal,kcal:avgArr(tracked.map(r=>r.meals[meal].calories))}));
  const mealMax=Math.max(...mealAvg.map(m=>m.kcal),1);
  const withinBudget=tracked.filter(r=>r.totals.calories<=r.budget).length;
  const avgDev=tracked.length?Math.round(avgArr(tracked.map(r=>r.totals.calories-r.budget))):0;
  const balance=tracked.reduce((a,r)=>a+(r.totals.calories-r.budget),0);

  let streak=0; for(let i=0;;i++){const k=addDays(today,-i);if((days[k]&&days[k].foods.length)>0)streak++;else break;}

  const totalDays=dayList.length, totalEntries=dayList.reduce((a,d)=>a+d.foods.length,0);
  const del=date=>{if(confirm('Tag '+dateLabel(date)+' wirklich aus dem Archiv löschen?'))setState(s=>{const ds={...s.days};delete ds[date];return{...s,days:ds};});};

function ExportOverlay({days,onClose}){
  const [copied,setCopied]=useState(false);

    const entries=[];

    entries.sort((a,b)=>a.date.localeCompare(b.date)||a.entry.time.localeCompare(b.entry.time));
    return serializeEntries(entries);
  },[days]);
  async function copy(){try{await navigator.clipboard.writeText(tsv);setCopied(true);setTimeout(()=>setCopied(false),1500);}catch(e){}}
  function download(){const blob=new Blob([tsv],{type:'text/tab-separated-values'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='essen-export-'+todayKey()+'.tsv';a.click();URL.revokeObjectURL(url);}

    <Overlay title="Export (Tab-Format)" onClose={onClose}>

        <textarea className="import-text" value={tsv} readOnly rows={12} spellCheck={false}/>

    </Overlay>
  );
}

function parseHash(){
  const h=location.hash.replace(/^#\/?/,''); const [t,d]=h.split('/');
  return {tab:TABS.some(x=>x.id===t)?t:null, date:(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=todayKey())?d:null};
}

/* ---------- App ---------- */
const TABS=[{id:'dashboard',label:'Dashboard',icon:'space_dashboard'},{id:'today',label:'Heute',icon:'restaurant'},{id:'stats',label:'Analyse',icon:'insights'},{id:'archive',label:'Archiv',icon:'inventory_2',desktop:true},{id:'profile',label:'Profil',icon:'settings'}];
function App(){
  const [state,rawSet]=useState(load);
  /* Jede inhaltliche Änderung (nicht: Darstellung) bekommt einen Zeitstempel – Basis für den Cloud-Abgleich. */
  const setState=useCallback(upd=>rawSet(s=>{const n=typeof upd==='function'?upd(s):upd;if(n===s)return s;const changed=SYNC_KEYS.some(k=>n[k]!==s[k]);return changed?{...n,meta:{...(n.meta||{}),updatedAt:new Date().toISOString()}}:n;}),[]);
  const init=useMemo(parseHash,[]);
  const [tab,setTab]=useState(init.tab||'dashboard');
  const [date,setDate]=useState(init.date||todayKey());
  const [importOpen,setImportOpen]=useState(null); // null | 'auto' | 'ai' | 'table'
  const [helpOpen,setHelpOpen]=useState(false);
  const [manualSignal,setManualSignal]=useState(0);
  const [updateReg,setUpdateReg]=useState(null);
  useEffect(()=>{const on=e=>setUpdateReg(e.detail);window.addEventListener('essen:update',on);return ()=>window.removeEventListener('essen:update',on);},[]);
  const [toast,setToast]=useState(null);
  useEffect(()=>{save(state);},[state]);
  const toastT=useRef(null);
  const notify=useCallback(msg=>{setToast(msg);clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToast(null),1900);},[]);
  const cloud=useCloud(state,rawSet,notify);
  const garmin=useGarmin(cloud);
  const openImport=useCallback((mode)=>setImportOpen(typeof mode==='string'?mode:'auto'),[]);

  const theme=(state.ui&&state.ui.theme==='dark')?'dark':'light';
  useEffect(()=>{
    const el=document.documentElement;
    if(theme==='dark')el.setAttribute('data-theme','dark');else el.removeAttribute('data-theme');
    const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',theme==='dark'?'#131316':'#f6f3ef');
  },[theme]);
  const toggleTheme=()=>setState(s=>({...s,ui:{...s.ui,theme:(s.ui&&s.ui.theme==='dark')?'light':'dark'}}));

  /* URL-Zustand: #tab bzw. #tab/JJJJ-MM-TT – Reload, Zurück/Vor und Lesezeichen funktionieren. */
  const prevTabRef=useRef(tab);
  useEffect(()=>{
    const hash='#'+tab+((tab==='today'||tab==='dashboard')?'/'+date:'');
    if(location.hash!==hash){ try{ if(tab!==prevTabRef.current)history.pushState(null,'',hash); else history.replaceState(null,'',hash); }catch(e){} }
    prevTabRef.current=tab;
  },[tab,date]);
  useEffect(()=>{
    const onPop=()=>{const r=parseHash();if(r.tab)setTab(r.tab);if(r.date)setDate(r.date);};
    window.addEventListener('popstate',onPop); return ()=>window.removeEventListener('popstate',onPop);
  },[]);

  const dateRef=useRef(date); dateRef.current=date;
  const tabRef=useRef(tab); tabRef.current=tab;
  const impRef=useRef(importOpen); impRef.current=importOpen;
  const helpRef=useRef(helpOpen); helpRef.current=helpOpen;
  const stateRef=useRef(state); stateRef.current=state;
  useEffect(()=>{
    const onKey=e=>{
      const t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
      if(e.metaKey||e.ctrlKey||e.altKey)return;
      if(helpRef.current){ if(e.key==='Escape'||e.key==='?')setHelpOpen(false); return; }
      if(impRef.current){ if(e.key==='Escape')setImportOpen(null); return; }
      const onDay=tabRef.current==='today'||tabRef.current==='dashboard';
      const k=e.key;
      if(k==='ArrowLeft'&&onDay){setDate(addDays(dateRef.current,-1));}
      else if(k==='ArrowRight'&&onDay){if(dateRef.current<todayKey())setDate(addDays(dateRef.current,1));}
      else if(k==='t'||k==='T'){setDate(todayKey());setTab('today');}
      else if(k==='i'||k==='I'){setImportOpen('table');}
      else if(k==='k'||k==='K'){setImportOpen('ai');}
      else if(k==='n'||k==='N'){setTab('today');setManualSignal(x=>x+1);}
      else if(k==='g'||k==='G'){const d=dateRef.current,p=addDays(d,-1),src=stateRef.current.days[p];if(src&&src.foods.length){copyDay(setState,p,d);setTab('today');notify('Mahlzeiten von gestern übernommen');}else notify('Gestern ist nichts erfasst');}
      else if(k==='?'){setHelpOpen(true);}
      else if(/^[1-5]$/.test(k)){const tt=TABS[+k-1];if(tt)setTab(tt.id);}
      else return;
      e.preventDefault();
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);

  const tk=todayKey(), tday=state.days[tk]; const remaining=dailyBudget(state.goal,tday)-sumCal(tday?tday.foods:[]);
  return (
    <div className="app">
      <main className="content">
        {tab==='dashboard' && <Dashboard state={state} setState={setState} date={date} setDate={setDate} openImport={openImport} cloud={cloud} garmin={garmin} notify={notify}/>}
        {tab==='today' && <Today state={state} setState={setState} date={date} setDate={setDate} openImport={openImport} notify={notify} manualSignal={manualSignal} cloud={cloud} garmin={garmin}/>}
        {tab==='stats' && <Stats state={state} setState={setState} setDate={setDate} goToToday={()=>setTab('today')} cloud={cloud} notify={notify} garmin={garmin}/>}
        {tab==='archive' && <ArchivePage state={state} setState={setState} goDay={d=>{setDate(d);setTab('today');}}/>}
        {tab==='profile' && <Profile state={state} setState={setState} notify={notify} setDate={setDate} goToDash={()=>setTab('dashboard')} cloud={cloud}/>}
      </main>
      <nav className="tabbar">
        <div className="brand"><span className="brand-icon"><Icon name="nutrition"/></span><span className="brand-name">Essen</span></div>
        {TABS.map((t,i)=>(
        <button key={t.id} className={'tab'+(tab===t.id?' active':'')+(t.desktop?' desk-only':'')} title={t.label+' ('+(i+1)+')'} onClick={()=>setTab(t.id)}>
          <span className="tab-icon"><Icon name={t.icon}/></span><span className="tab-label">{t.label}</span></button>))}
        <button className="side-stat desk-only" onClick={()=>{setDate(tk);setTab('today');}} title="Heute (t)">
          <span className={'side-stat-value'+(remaining<0?' over':'')}>{remaining<0?'+'+Math.abs(remaining):remaining} kcal</span>
          <span className="side-stat-label">{remaining<0?'über Budget heute':'heute übrig'}</span>
        </button>
        <button className="tab theme-toggle" onClick={toggleTheme} title="Hell/Dunkel umschalten" aria-label="Design umschalten">
          <span className="tab-icon"><Icon name={theme==='dark'?'light_mode':'dark_mode'}/></span>
          <span className="tab-label">{theme==='dark'?'Hell':'Dunkel'}</span></button>
        {cloud.configured && <button className={'tab cloud-tab '+cloud.status} onClick={()=>setTab('profile')} title={cloud.user?('Cloud: '+(cloud.err||cloud.status)):'Cloud: nicht angemeldet'} aria-label="Cloud-Status">
          <span className="tab-icon"><Icon name={!cloud.user?'cloud_off':cloud.status==='syncing'?'cloud_sync':cloud.status==='error'?'cloud_alert':'cloud_done'}/></span>
          <span className="tab-label">{!cloud.user?'Offline':cloud.status==='syncing'?'Sync …':cloud.status==='error'?'Fehler':'Cloud'}</span></button>}
        <button className="tab help-tab desk-only" onClick={()=>setHelpOpen(true)} title="Tastenkürzel (?)" aria-label="Tastenkürzel">
          <span className="tab-icon"><Icon name="keyboard"/></span><span className="tab-label">Kürzel</span></button>
      </nav>
      {importOpen && <ImportPanel state={state} setState={setState} setDate={setDate} onClose={()=>setImportOpen(null)} cloud={cloud} date={date} notify={notify} initialMode={importOpen}/>}
      {helpOpen && <HelpOverlay onClose={()=>setHelpOpen(false)}/>}
      {updateReg && <button className="update-bar" onClick={()=>{try{updateReg.waiting&&updateReg.waiting.postMessage('skipWaiting');}catch(e){}setUpdateReg(null);}}><Icon name="system_update_alt"/> Neue Version verfügbar – jetzt laden</button>}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
/* Installierbar & offline: Service Worker nur über http(s), nicht bei Doppelklick auf die Datei. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)window.dispatchEvent(new CustomEvent('essen:update',{detail:reg}));});});
    }).catch(()=>{});
    let reloading=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  });
}
</script>
</body>
</html>
